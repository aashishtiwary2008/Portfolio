<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14181f" />
      <stop offset="50%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="goldForks" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c69214" />
      <stop offset="50%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e38" />
      <stop offset="50%" stop-color="#111317" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="headlightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#80d8ff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Subtle Bamboo Grove Silhouette Backdrop -->
  <g opacity="0.18" stroke="#3b5249" stroke-width="4">
    <line x1="80" y1="0" x2="90" y2="700" />
    <line x1="120" y1="0" x2="125" y2="720" />
    <line x1="180" y1="0" x2="175" y2="680" />
    <line x1="620" y1="0" x2="615" y2="700" />
    <line x1="680" y1="0" x2="690" y2="720" />
    <line x1="740" y1="0" x2="735" y2="690" />
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="940" rx="340" ry="45" fill="#000000" opacity="0.85" />

  <!-- Motorcycle Body & Front Assembly -->
  <!-- Golden Inverted Front Forks (Iconic Honda Feature) -->
  <rect x="250" y="550" width="22" height="230" rx="6" fill="url(#goldForks)" filter="url(#glow)" />
  <rect x="528" y="550" width="22" height="230" rx="6" fill="url(#goldForks)" filter="url(#glow)" />

  <!-- Front Wheel & Disc Brake -->
  <ellipse cx="400" cy="800" rx="90" ry="160" fill="#15171c" stroke="#2c3038" stroke-width="12" />
  <circle cx="400" cy="800" r="60" fill="#090a0d" stroke="#505561" stroke-width="6" stroke-dasharray="10 6" />

  <!-- Front Fender / Mudguard -->
  <path d="M 310 640 Q 400 590 490 640 L 470 700 Q 400 660 330 700 Z" fill="#0a0b0e" stroke="#222" stroke-width="2" />

  <!-- Twin LED Headlight Assembly -->
  <polygon points="340,430 460,430 445,490 400,520 355,490" fill="#0d0e12" stroke="#262930" stroke-width="3" />
  <polygon points="360,445 440,445 430,480 400,500 370,480" fill="#ffffff" filter="url(#glow)" opacity="0.9" />
  <polygon points="375,455 425,455 420,475 400,490 380,475" fill="#e0f7fa" />

  <!-- Headlight glow beam -->
  <polygon points="350,510 450,510 580,950 220,950" fill="url(#headlightBeam)" opacity="0.12" />

  <!-- Number Plate Holder (WB 19X 4819) -->
  <rect x="320" y="395" width="160" height="32" rx="4" fill="#090a0d" stroke="#333" stroke-width="2" />
  <text x="400" y="417" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">WB · 19X · 4819</text>

  <!-- Handlebars & Aerodynamic Mirrors -->
  <path d="M 230 310 Q 320 330 400 335 Q 480 330 570 310" stroke="#1c1f26" stroke-width="18" fill="none" stroke-linecap="round" />
  <!-- Left Mirror -->
  <polygon points="180,240 250,270 240,285 170,255" fill="#0a0c10" stroke="#333" stroke-width="2" />
  <!-- Right Mirror -->
  <polygon points="620,240 550,270 560,285 630,255" fill="#0a0c10" stroke="#333" stroke-width="2" />

  <!-- Rider Body (Aashish) -->
  <!-- Legs / Dark Denim -->
  <path d="M 330 460 L 290 680 L 330 710 L 360 520 Z" fill="#181a20" />
  <path d="M 470 460 L 510 680 L 470 710 L 440 520 Z" fill="#14161c" />

  <!-- Sneaker (White/Blue accent) -->
  <ellipse cx="280" cy="710" rx="35" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
  <ellipse cx="520" cy="710" rx="35" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="3" />

  <!-- Torso: Stylish Patterned Shirt (Black & White Textured) -->
  <path d="M 290 220 Q 400 240 510 220 L 500 480 Q 400 500 300 480 Z" fill="#20242c" stroke="#374151" stroke-width="3" />
  <!-- Texture Pattern lines -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.4">
    <line x1="320" y1="240" x2="350" y2="280" />
    <line x1="380" y1="235" x2="410" y2="285" />
    <line x1="440" y1="245" x2="470" y2="290" />
    <line x1="310" y1="310" x2="345" y2="360" />
    <line x1="370" y1="320" x2="400" y2="380" />
    <line x1="430" y1="310" x2="465" y2="370" />
    <line x1="330" y1="400" x2="360" y2="460" />
    <line x1="410" y1="410" x2="440" y2="470" />
  </g>

  <!-- Arms & Riding Gloves -->
  <path d="M 300 230 L 220 320 L 245 335 L 330 270 Z" fill="#1a1d24" />
  <path d="M 500 230 L 580 320 L 555 335 L 470 270 Z" fill="#1a1d24" />
  <!-- Left Glove on Throttle/Clutch -->
  <circle cx="230" cy="325" r="22" fill="#090a0d" stroke="#444" stroke-width="3" />
  <!-- Right Glove -->
  <circle cx="570" cy="325" r="22" fill="#090a0d" stroke="#444" stroke-width="3" />

  <!-- Full-Face Helmet (Iconic Black Helmet with Tinted Visor) -->
  <ellipse cx="400" cy="140" rx="88" ry="105" fill="#0a0c10" stroke="#22252c" stroke-width="4" />
  <!-- Helmet Top Aerodynamic Ridge -->
  <path d="M 370 45 Q 400 35 430 45 L 420 80 Q 400 75 380 80 Z" fill="#181b22" />
  <!-- Dark Gloss Visor with Sky/Road Reflection -->
  <path d="M 335 110 Q 400 95 465 110 Q 475 165 460 195 Q 400 220 340 195 Q 325 165 335 110 Z" fill="url(#visorGrad)" stroke="#3f4552" stroke-width="3" />
  <!-- Visor Reflection Highlight -->
  <path d="M 350 120 Q 400 110 445 120 Q 440 145 425 155 Q 395 140 360 155 Z" fill="#ffffff" opacity="0.18" />

  <!-- Modern Graphic Accents (AKT Monogram Badge on Chest) -->
  <rect x="365" y="270" width="70" height="26" rx="6" fill="#000000" stroke="#ffffff" stroke-width="1.5" />
  <text x="400" y="288" font-family="'Anton', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">AKT</text>
</svg>
